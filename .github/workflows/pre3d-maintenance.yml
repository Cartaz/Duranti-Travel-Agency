name: Pre-3D branch maintenance

on:
  push:
    branches:
      - chatgpt/pre-3d-close-all-findings

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/pre-3d-close-all-findings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Scope application service consumers
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import { extname, join } from 'node:path'

          async function collect(directory) {
            const files = []
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name)
              if (entry.isDirectory()) files.push(...await collect(path))
              else if (entry.isFile() && ['.ts', '.tsx'].includes(extname(path))) files.push(path)
            }
            return files
          }

          for (const path of await collect('src/features')) {
            let source = await readFile(path, 'utf8')
            let changed = false
            source = source.replace(/const\s+\{([^{}]+)\}\s*=\s*useApplicationServices\(\)/g, (match, bindings) => {
              const keys = bindings.split(',').map((binding) => binding.trim().split(':')[0].trim()).filter(Boolean)
              if (keys.length === 0) return match
              changed = true
              return match.replace('useApplicationServices()', `useApplicationServices(${keys.map((key) => `'${key}'`).join(', ')})`)
            })
            if (changed) await writeFile(path, source)
          }
          NODE
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features package-lock.json
          git commit -m "chore: normalize pre-3D dependency boundaries"
          git push
