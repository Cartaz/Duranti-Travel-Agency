name: N8 Migration

on: push

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/pre-3d-close-all-findings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply, validate and commit
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: run N8 migration v2" ]; then
            exit 0
          fi
          python scripts/apply-pre3d-n8.py
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: index place references and preserve Vault v1"
          git push origin HEAD:chatgpt/pre-3d-close-all-findings

# Temporary branch-only migration runner; removed after N8 is committed.
