name: Apply pre-3D N8 migration

on:
  push:
    branches:
      - chatgpt/pre-3d-close-all-findings

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: stage N8 migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/pre-3d-close-all-findings

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply index-only database migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}')
              file.write_text(source.replace(old, new, 1))

          replace_once(
              'src/data/db/dtagency-db.ts',
              "export const DB_VERSION = 1",
              "export const DB_VERSION = 2",
          )
          replace_once(
              'src/data/db/dtagency-db.ts',
              'const STORES = {',
              'const STORES_V1 = {',
          )
          replace_once(
              'src/data/db/dtagency-db.ts',
              "} as const\n\nexport class DTAgencyDatabase",
              "} as const\n\nconst STORES_V2 = {\n  ...STORES_V1,\n  blocks: 'id, tripId, dayId, parentBlockId, content.placeId, [dayId+position], updatedAt',\n  media: 'id, tripId, dayId, blockId, placeId, kind, sha256, updatedAt',\n} as const\n\nexport class DTAgencyDatabase",
          )
          replace_once(
              'src/data/db/dtagency-db.ts',
              '    this.version(DB_VERSION).stores(STORES)',
              '    this.version(1).stores(STORES_V1)\n    this.version(DB_VERSION).stores(STORES_V2)',
          )

          replace_once(
              'src/data/repositories/place-repository.ts',
              "function blockReferencesPlace(content: Record<string, unknown>, placeId: string): boolean {\n  return content.placeId === placeId\n}\n\n",
              '',
          )
          replace_once(
              'src/data/repositories/place-repository.ts',
              "        db.blocks.toArray().then((items) => items.filter((item) => !item.deletedAt && blockReferencesPlace(item.content, id)).length),",
              "        db.blocks.where('content.placeId').equals(id).toArray().then((items) => items.filter((item) => !item.deletedAt).length),",
          )
          replace_once(
              'src/data/repositories/place-repository.ts',
              "        db.media.toArray().then((items) => items.filter((item) => !item.deletedAt && item.placeId === id).length),",
              "        db.media.where('placeId').equals(id).toArray().then((items) => items.filter((item) => !item.deletedAt).length),",
          )

          Path('src/vault/database-schema-compatibility.ts').write_text("""import { DB_VERSION } from '../data/db/dtagency-db'\n\nconst LEGACY_DATABASE_SCHEMA_VERSION = 1\n\nexport function normalizeVaultDatabaseSchemaVersion(value: unknown): number {\n  if (value !== LEGACY_DATABASE_SCHEMA_VERSION && value !== DB_VERSION) {\n    throw new Error('Vault database schema is incompatible with this app version.')\n  }\n  return DB_VERSION\n}\n""")

          replace_once(
              'src/vault/import.ts',
              "import { DB_NAME, DB_VERSION, db } from '../data/db/dtagency-db'\n",
              "import { DB_NAME, DB_VERSION, db } from '../data/db/dtagency-db'\nimport { normalizeVaultDatabaseSchemaVersion } from './database-schema-compatibility'\n",
          )
          replace_once(
              'src/vault/import.ts',
              "  if (value.database.name !== DB_NAME || value.database.schemaVersion !== DB_VERSION) {\n    throw new Error('Vault database schema is incompatible with this app version.')\n  }\n\n  const tables = validateTables(value.database.tables)",
              "  if (value.database.name !== DB_NAME) {\n    throw new Error('Vault database schema is incompatible with this app version.')\n  }\n  normalizeVaultDatabaseSchemaVersion(value.database.schemaVersion)\n\n  const tables = validateTables(value.database.tables)",
          )

          replace_once(
              'scripts/check-repo-policy.mjs',
              'const maximumSchemaVersionBeforeVaultMigration = 1',
              'const maximumSchemaVersionBeforeVaultMigration = 2',
          )

          Path('tests/storage/database-contract.test.ts').write_text("""import assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\nimport test from 'node:test'\n\nconst source = await readFile(new URL('../../src/data/db/dtagency-db.ts', import.meta.url), 'utf8')\n\ntest('database keeps v1 and declares the index-only v2 schema', () => {\n  assert.match(source, /export const DB_NAME = 'dtagency'/)\n  assert.match(source, /export const DB_VERSION = 2/)\n  assert.match(source, /this\\.version\\(1\\)\\.stores\\(STORES_V1\\)/)\n  assert.match(source, /this\\.version\\(DB_VERSION\\)\\.stores\\(STORES_V2\\)/)\n  assert.equal((source.match(/\\.version\\(/g) ?? []).length, 2)\n})\n\ntest('v2 adds only query indexes and needs no row upgrader', () => {\n  assert.match(source, /content\\.placeId/)\n  assert.match(source, /media: 'id, tripId, dayId, blockId, placeId, kind, sha256, updatedAt'/)\n  assert.doesNotMatch(source, /\\.upgrade\\s*\\(/)\n})\n""")

          Path('tests/storage/place-reference-index.test.ts').write_text("""import assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\nimport test from 'node:test'\n\nconst source = await readFile(new URL('../../src/data/repositories/place-repository.ts', import.meta.url), 'utf8')\n\ntest('safe place deletion resolves every reverse reference through an index', () => {\n  assert.match(source, /db\\.blocks\\.where\\('content\\.placeId'\\)\\.equals\\(id\\)/)\n  assert.match(source, /db\\.reservations\\.where\\('placeId'\\)\\.equals\\(id\\)/)\n  assert.match(source, /db\\.itineraries\\.where\\('placeId'\\)\\.equals\\(id\\)/)\n  assert.match(source, /db\\.media\\.where\\('placeId'\\)\\.equals\\(id\\)/)\n  assert.doesNotMatch(source, /db\\.(blocks|media)\\.toArray\\(\\)/)\n})\n""")

          Path('tests/vault/database-schema-compatibility.test.ts').write_text("""import assert from 'node:assert/strict'\nimport test from 'node:test'\nimport { DB_VERSION } from '../../src/data/db/dtagency-db.ts'\nimport { normalizeVaultDatabaseSchemaVersion } from '../../src/vault/database-schema-compatibility.ts'\n\ntest('Vault accepts the frozen v1 snapshot and normalizes it to the current index-only schema', () => {\n  assert.equal(DB_VERSION, 2)\n  assert.equal(normalizeVaultDatabaseSchemaVersion(1), DB_VERSION)\n  assert.equal(normalizeVaultDatabaseSchemaVersion(DB_VERSION), DB_VERSION)\n})\n\ntest('Vault rejects unknown database schema versions', () => {\n  for (const value of [0, 3, '1', null, undefined]) {\n    assert.throws(() => normalizeVaultDatabaseSchemaVersion(value), /incompatible/)\n  }\n})\n""")

          Path('docs/architecture/db-v2-place-reference-indexes.md').write_text("""# Database v2 — place reference indexes\n\nDTAgency database v2 is an index-only migration from the frozen v1 schema. No entity shape, table inventory, primary key, Vault framing or OPFS namespace changes.\n\n## Added indexes\n\n- `blocks.content.placeId` supports reverse lookup of planner place blocks without scanning the blocks table.\n- `media.placeId` supports reverse lookup of gallery/media place references without scanning the media table.\n\nDexie keeps both schema declarations. Existing v1 databases are upgraded by IndexedDB when opened; no `.upgrade()` row transformation is required because only indexes change.\n\n## Vault compatibility\n\nThe `.dtagency` Vault format remains version 1. Database snapshots with schema version 1 remain accepted. During authenticated import the snapshot schema version is normalized in memory to the current database version before restore. Rows are not rewritten because v1 and v2 have the same persisted entity shapes.\n\nFuture database version increments must explicitly extend the compatibility policy and tests rather than being accepted implicitly.\n""")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate migration
        run: npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/db/dtagency-db.ts src/data/repositories/place-repository.ts src/vault/import.ts src/vault/database-schema-compatibility.ts scripts/check-repo-policy.mjs tests/storage/database-contract.test.ts tests/storage/place-reference-index.test.ts tests/vault/database-schema-compatibility.test.ts docs/architecture/db-v2-place-reference-indexes.md
          git commit -m "fix: index place references and preserve Vault v1"
          git push origin HEAD:chatgpt/pre-3d-close-all-findings
