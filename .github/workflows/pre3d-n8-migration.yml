name: Apply pre-3D N8 migration

on:
  push:
    branches:
      - chatgpt/pre-3d-close-all-findings

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: run N8 migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chatgpt/pre-3d-close-all-findings

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply deterministic migration
        run: python scripts/apply-pre3d-n8.py

      - name: Install dependencies
        run: npm ci

      - name: Validate migration
        run: npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: index place references and preserve Vault v1"
          git push origin HEAD:chatgpt/pre-3d-close-all-findings
